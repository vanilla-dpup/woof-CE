name: build

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
      ref:
        type: string
        required: true
      name:
        type: string
      version:
        type: string
      arch:
        type: string
        required: true
      compat-distro:
        type: string
        required: true
      compat-distro-version:
        type: string
        required: true
      kernel:
        type: string
        required: true
      prefix:
        type: string
      artifact:
        type: string
        required: true
      retention:
        type: number
        required: true
      variant:
        type: string
      runner:
        type: string
        default: 'ubuntu-24.04'

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
    - name: Free space
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /usr/share/swift # increase free space, we don't need these
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.ref }}
    - name: Configure
      run: sudo sed -i -e s/^DISTRO_BINARY_COMPAT=.*/DISTRO_BINARY_COMPAT=${{ inputs.compat-distro }}/ -e s/^DISTRO_COMPAT_VERSION=.*/DISTRO_COMPAT_VERSION=${{ inputs.compat-distro-version }}/ -e s/^DISTRO_TARGETARCH=.*/DISTRO_TARGETARCH=${{ inputs.arch }}/ -e 's/^DISTRO_NAME=.*/DISTRO_NAME="${{ inputs.name }}"/' -e s/^DISTRO_VERSION=.*/DISTRO_VERSION=${{ inputs.version }}/ -e s/^DISTRO_FILE_PREFIX=.*/DISTRO_FILE_PREFIX=${{ inputs.prefix }}/ DISTRO_SPECS
    - name: Set variant
      if: ${{ inputs.variant != '' }}
      run: echo "DISTRO_VARIANT=${{ inputs.variant }}" >> $GITHUB_ENV
    - name: Prepare build environment
      timeout-minutes: 5
      run: |
        find -type f -name .gitignore -delete
        sudo chown -R root:root .
        sudo mkdir -p ../buildenv
        sudo cp -a . ../buildenv/woof-CE
        sudo rm -rf ../buildenv/woof-CE/.git
        sudo mkdir -p $GITHUB_WORKSPACE/rootfs-skeleton/usr/local/share/woof-CE
        sudo sh -c "tar -C ../buildenv -c woof-CE | xz -9 > $GITHUB_WORKSPACE/rootfs-skeleton/usr/local/share/woof-CE/woof-CE.tar.xz"
        sudo cp -a rootfs-skeleton/usr/local/share/woof-CE ../buildenv/woof-CE/rootfs-skeleton/usr/local/share/
    - name: Create cache directories
      run: sudo mkdir -p local-repositories petbuild-sources petbuild-cache petbuild-output
    - name: Get cached local-repositories
      uses: actions/cache@v4
      with:
        path: local-repositories
        key: local-repositories-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-${{ inputs.variant }}-${{ github.sha }}
        restore-keys: |
          local-repositories-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-${{ inputs.variant }}-
          local-repositories-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends debootstrap
        [ ${{ inputs.compat-distro }} != devuan ] || curl https://git.devuan.org/devuan/debootstrap/raw/branch/master/scripts/ceres | sudo tee /usr/share/debootstrap/scripts/`echo ${{ inputs.compat-distro-version }} | sed s/64$//`
    - name: 1download
      timeout-minutes: 120
      run: |
        sudo chown -R root:root .
        sudo -E ./1download
    - name: Get cached kernel-kit output
      uses: dawidd6/action-download-artifact@v6
      with:
        repo: vanilla-dpup/woof-CE
        branch: vanilladpup-12.0.x
        workflow: ${{ startsWith(inputs.kernel, 'debian-') && 'dpup-kernel.yml' || (startsWith(inputs.kernel, 'ubuntu-') && 'upup-kernel.yml' || 'kernel-kit.yml') }}
        workflow_conclusion: success
        name: kernel-kit-output-usrmerge-${{ inputs.kernel }}-${{ inputs.arch }}
        path: kernel-kit/output
    - name: Get cached petbuild-output
      uses: actions/cache@v4
      with:
        path: petbuild-output
        key: petbuild-output-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-${{ inputs.variant }}-${{ github.sha }}
        restore-keys: |
          petbuild-output-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-${{ inputs.variant }}-
          petbuild-output-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-
    - name: Get cached petbuild-cache
      uses: actions/cache@v4
      with:
        path: petbuild-cache
        key: petbuild-cache-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-${{ inputs.variant }}-${{ github.sha }}
        restore-keys: |
          petbuild-cache-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-${{ inputs.variant }}-
          petbuild-cache-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-
    - name: Get cached petbuild-sources
      uses: actions/cache@v4
      with:
        path: petbuild-sources
        key: petbuild-sources-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-${{ inputs.variant }}-${{ github.sha }}
        restore-keys: |
          petbuild-sources-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-${{ inputs.variant }}-
          petbuild-sources-${{ inputs.arch }}-${{ inputs.compat-distro }}-${{ inputs.compat-distro-version }}-
          petbuild-sources-${{ inputs.arch }}-${{ inputs.compat-distro }}-
          petbuild-sources-${{ inputs.arch }}-
          petbuild-sources-
    - name: 3builddistro
      timeout-minutes: 180
      run: |
        sudo chown -R root:root petbuild-{sources,cache,output}
        sudo -E ./3builddistro release
    - name: Build woof-CE.tar.gz
      run: |
        sudo mv petbuild-sources local-repositories ../buildenv/woof-CE/
        sudo tar -C ../buildenv -c -I "gzip -9" -f $GITHUB_WORKSPACE/woof-CE.tar.gz woof-CE
        sudo mv ../buildenv/woof-CE/petbuild-sources ../buildenv/woof-CE/local-repositories .
    - name: Move build output
      run: |
        for i in `ls woof-output-*/*.img 2>/dev/null`; do sudo gzip -1 $i; done
        for i in `ls woof-output-*/*.{img.gz,iso} 2>/dev/null`; do sudo mv -f $i .; done
    - name: Set cache ownership
      run: sudo chown -R --reference ~ local-repositories petbuild-{sources,cache,output}
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: |
          *.img.gz
          woof-CE.tar.gz
        retention-days: ${{ inputs.retention }}
        compression-level: 0
