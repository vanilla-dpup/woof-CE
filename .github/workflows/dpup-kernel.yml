name: dpup-kernel

on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  forky:
    if: github.event_name != 'schedule' || (github.repository == 'vanilla-dpup/woof-CE' && github.ref == 'refs/heads/vanilladpup-12.0.x')
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
      volumes:
        - /usr:/hostusr
      options: --privileged
    continue-on-error: ${{ matrix.release == 'unstable' }}
    strategy:
      matrix:
        include:
          - release: unstable
            kernel-release: unstable
          - release: unstable
            kernel-release: trixie
          - release: unstable
            kernel-release: bookworm
          - release: testing
            kernel-release: testing
    steps:
      - uses: actions/checkout@v4
      - name: Free space
        run: rm -rf /hostusr/local/lib/android /hostusr/share/dotnet /hostusr/local/.ghcup /hostusr/share/swift # increase free space, we don't need these
      - name: Install dependencies
        run: apt-get update -qq && apt-get install -y --no-install-recommends debootstrap
      - name: Configure
        run: sed -i -e s/^DISTRO_COMPAT_VERSION=.*/DISTRO_COMPAT_VERSION=${{ matrix.release }}/ -e s/^DISTRO_COMPAT_KERNEL_VERSION=.*/DISTRO_COMPAT_KERNEL_VERSION=${{ matrix.kernel-release }}/ DISTRO_SPECS
      - name: 1download
        run: ./1download
      - name: 2buildkernel
        run: ./2buildkernel
      - name: Move build output
        run: mv kernel-kit/output $GITHUB_WORKSPACE/
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-kit-output-usrmerge-debian-${{ matrix.release }}-${{ matrix.kernel-release }}-x86_64
          path: output
          retention-days: 16
          compression-level: 0
  trixie:
    if: github.event_name != 'schedule' || (github.repository == 'vanilla-dpup/woof-CE' && github.ref == 'refs/heads/vanilladpup-12.0.x')
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie-slim
      volumes:
        - /usr:/hostusr
      options: --privileged
    strategy:
      matrix:
        kernel-release: [trixie, bookworm]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vanilladpup-11.0.x
      - name: Free space
        run: rm -rf /hostusr/local/lib/android /hostusr/share/dotnet /hostusr/local/.ghcup /hostusr/share/swift # increase free space, we don't need these
      - name: Install dependencies
        run: apt-get update -qq && apt-get install -y --no-install-recommends debootstrap
      - name: merge2out
        timeout-minutes: 5
        run: ./merge2out woof-distro/x86_64/debian/trixie && sed -i s/^DISTRO_COMPAT_KERNEL_VERSION=.*/DISTRO_COMPAT_KERNEL_VERSION=${{ matrix.kernel-release }}/ ../woof-out_*/DISTRO_SPECS
      - name: 1download
        run: cd ../woof-out_* && ./1download
      - name: 2buildkernel
        run: cd ../woof-out_* && ./2buildkernel
      - name: Move build output
        run: mv ../woof-out_*/kernel-kit/output $GITHUB_WORKSPACE/
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-kit-output-usrmerge-debian-trixie-${{ matrix.kernel-release }}-x86_64
          path: output
          retention-days: 16
          compression-level: 0
  bookworm:
    if: github.event_name != 'schedule' || (github.repository == 'vanilla-dpup/woof-CE' && github.ref == 'refs/heads/vanilladpup-12.0.x')
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm-slim
      volumes:
        - /usr:/hostusr
      options: --privileged
    strategy:
      matrix:
        include:
          - arch: x86_64
            base: config.amd64_none_amd64.xz
          - arch: x86
            base: config.i386_none_686-pae.xz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vanilladpup-10.0.x
      - name: Free space
        run: rm -rf /hostusr/local/lib/android /hostusr/share/dotnet /hostusr/local/.ghcup /hostusr/share/swift # increase free space, we don't need these
      - name: Install dependencies
        run: |
          echo "deb http://deb.debian.org/debian bookworm main contrib non-free" > /etc/apt/sources.list
          echo "deb http://deb.debian.org/debian bookworm-updates main contrib non-free" >> /etc/apt/sources.list
          echo "deb http://deb.debian.org/debian-security bookworm-security main contrib non-free" >> /etc/apt/sources.list
          [ ${{ matrix.arch }} != x86 ] || dpkg --add-architecture i386
          apt-get update -qq
          apt-get upgrade -y
          apt-get install -y --no-install-recommends curl wget ca-certificates git file squashfs-tools xz-utils diffutils patch make flex bison python3 bc bzip2 kmod rsync libelf-dev libssl-dev dwarves gcc jq
          apt-get install -y linux-source
          [ ${{ matrix.arch }} != x86 ] || apt-get install -y --no-install-recommends gcc-multilib `dpkg --get-selections | grep -m1 ^linux-config- | awk '{print $1}' | sed s/amd64/i386/`
          curl https://raw.githubusercontent.com/puppylinux-woof-CE/initrd_progs/025e7a2493041e52c9bbcaca027f4fce68c0f206/pkg/w_apps_static/w_apps/vercmp.c | gcc -x c -o /usr/local/bin/vercmp -
          echo "dash dash/sh boolean false" | debconf-set-selections
          DEBIAN_FRONTEND=noninteractive dpkg-reconfigure dash
      - name: Build kernel
        run: |
          cd kernel-kit
          tar -xJf /usr/src/linux-source-*.tar.xz
          cfg=`ls /usr/src/linux-config-*/${{ matrix.base }}`
          xz -dc $cfg > /tmp/base
          ver=`grep -Fm1 "Kernel Configuration" /tmp/base | cut -f 3 -d ' '`
          mv -f linux-source-* linux-$ver
          mkdir -p sources/kernels
          tar -c linux-$ver | xz -1 > sources/kernels/linux-$ver.tar.xz
          cd linux-$ver
          ./scripts/kconfig/merge_config.sh /tmp/base ../debian-diffconfigs/bookworm
          mv -f .config ../configs_${{ matrix.arch }}/DOTconfig-$ver-${{ matrix.arch }}
          cd ..
          rm -rf linux-$ver
          md5sum sources/kernels/linux-$ver.tar.xz | sed s~sources/kernels/~~ > sources/kernels/linux-$ver.tar.xz.md5.txt
          echo "DOTconfig_file=configs_${{ matrix.arch }}/DOTconfig-$ver-${{ matrix.arch }}" >> build.conf
          echo "kernel_ver=$ver" >> build.conf
          echo "package_name_suffix=kernel-kit" >> build.conf
          echo "COMP=\"-comp zstd -Xcompression-level 19 -b 256K -no-exports -no-xattrs\"" >> build.conf
          echo "fware=n" >> build.conf
          echo "AUTO=yes" >> build.conf
          echo "AUFS=no" >> build.conf
          CREATE_KBUILD_SFS=yes ./build.sh
          ./usrmerge.sh
          mkdir small-output
          mv `ls output/kernel_sources-*.sfs* output/kbuild-*.sfs* output/*.tar* 2>/dev/null` small-output
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-kit-output-usrmerge-debian-bookworm-${{ matrix.arch }}
          path: kernel-kit/small-output
          retention-days: 16
